<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essência Global - Catálogo Completo</title>
    <link rel="stylesheet" href="estilos/base.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Essência Global</h1>
        <button id="menu-btn" aria-label="Abrir menu">&#9776;</button>
        <nav id="menu">
            <ul class="menu-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="catalogo.html" class="active">Catálogo</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h2>Coleção Completa</h2>
            <p>Explore a nossa seleção exclusiva com as melhores fragrâncias internacionais.</p>
        </section>

        <section class="destaques">
            <div id="perfumes-container" class="grid-container">
            </div>
        </section>

        <!-- Estrutura do Modal (Oculta por padrão) -->
        <div id="modal-perfume" class="modal">
            <div class="modal-conteudo">
                <span id="fechar-modal">&times;</span>
                <h3 id="modal-nome"></h3>
                <img id="modal-img" src="" alt="Imagem do perfume">
                <p><strong>Marca:</strong> <span id="modal-marca"></span></p>
                <p><strong>Categoria:</strong> <span id="modal-categoria"></span></p>

                <!-- Pirâmide Olfativa -->
                <div class="notas-olfativas">
                    <h4>Pirâmide Olfativa</h4>
                    <p><strong>Topo:</strong> <span id="modal-topo"></span></p>
                    <p><strong>Coração:</strong> <span id="modal-coracao"></span></p>
                    <p><strong>Fundo:</strong> <span id="modal-fundo"></span></p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="ano"></span> | Vinícius Andrade Chuman | WDD 231</p>
    </footer>

    <script type="module" src="scripts/main.js"></script>
</body>
</html>
